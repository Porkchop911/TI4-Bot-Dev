[package]
name = "ti4-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ti4-model.workspace = true
ti4-content.workspace = true
serde.workspace = true
serde_json.workspace = true
# No default features: they pull `getrandom`, which has no `wasm32-unknown-unknown` backend, and
# the engine only ever draws from seeded streams.
rand = { version = "0.9", default-features = false }
rand_chacha.workspace = true
sha2.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
bitflags.workspace = true
enumset.workspace = true
itertools.workspace = true
ts-rs = { workspace = true, optional = true }

# The TypeScript types of the wire (`ti4_wasm::wire_ts`); off but in the tests of the browser game.
[features]
ts = ["dep:ts-rs", "ti4-model/ts"]

[dev-dependencies]
strum.workspace = true
proptest.workspace = true

[lints]
workspace = true
