[package]
name = "ti4-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ti4-model = { workspace = true }
ti4-content = { workspace = true }
ti4-engine = { workspace = true }
ti4-policy = { workspace = true }
ti4-rule-bot = { workspace = true }
ti4-view = { workspace = true }
ti4-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
hex = { workspace = true }
futures-util = "0.3"
sha2 = { workspace = true }

[dev-dependencies]
# The wasm host as a native library, for the test that both hosts play the same game.
ti4-wasm = { path = "../ti4-wasm" }
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# The binary has no tests; without this it is linked a second time as an empty test executable.
[[bin]]
name = "server"
path = "src/bin/server.rs"
test = false
