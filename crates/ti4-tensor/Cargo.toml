[package]
name = "ti4-tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tch.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = "1"
sha2.workspace = true

# Cargo requires this crate to restate workspace lints when overriding `unsafe_code` from `forbid`
# to `deny`, so the approved `cuda_cache` module can carry `#[allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
duplicate_macro_attributes = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ti4_cuda_cache)"] }

[lints.clippy]
# These groups mirror [workspace.lints.clippy]; Cargo does not allow inheriting and overriding
# workspace lints in the same package manifest.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
type_complexity = "warn"
