[package]
name = "ti4-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The MLP policy without libtorch: the `.ti4m` model file, its pack tool, and the forward pass on
# hand-written kernels. Clean for wasm: no `tch`, no file system outside `bundle` and the pack tool.

[[bin]]
name = "ti4-pack"
path = "src/bin/pack.rs"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

# Cargo requires a crate to restate the workspace lints when it overrides `unsafe_code` from
# `forbid` to `deny`, so that the `simd` module (the backends and the aligned buffer) can carry
# `#[allow(unsafe_code)]`. Nothing else in the crate may.
[lints.rust]
unsafe_code = "deny"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
duplicate_macro_attributes = "deny"

[lints.clippy]
# These groups mirror [workspace.lints.clippy]; Cargo does not allow inheriting and overriding
# workspace lints in the same package manifest.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
type_complexity = "warn"
