[workspace]
resolver = "2"
members = [
    "crates/ti4-model",
    "crates/ti4-content",
    "crates/ti4-engine",
    "crates/ti4-policy",
    "crates/ti4-sim",
    "crates/ti4-training",
    "crates/ti4-bridge",
    "crates/ti4-legacy",
    "crates/ti4-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
# Internal
ti4-model = { path = "crates/ti4-model" }
ti4-content = { path = "crates/ti4-content" }
ti4-engine = { path = "crates/ti4-engine" }
ti4-policy = { path = "crates/ti4-policy" }
ti4-sim = { path = "crates/ti4-sim" }
ti4-training = { path = "crates/ti4-training" }
ti4-bridge = { path = "crates/ti4-bridge" }
ti4-legacy = { path = "crates/ti4-legacy" }
ti4-cli = { path = "crates/ti4-cli" }
xtask = { path = "crates/xtask" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_stacker = "0.1"
bincode = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rand_chacha = "0.9"
parquet = "55"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
anyhow = "1"
itertools = "0.14"
smallvec = "1"
hashbrown = "0.15"
indexmap = "2"
bitflags = "2"
enumset = "1.1.5"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
criterion = "0.5"
proptest = "1.6"
rstest = "0.26"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
split-debuginfo = "packed"
