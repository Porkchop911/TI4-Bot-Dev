[workspace]
resolver = "2"
members = [
    "crates/ti4-model",
    "crates/ti4-content",
    "crates/ti4-engine",
    "crates/ti4-policy",
    "crates/ti4-sim",
    "crates/ti4-calc",
    "crates/ti4-training",
    "crates/ti4-bridge",
    "crates/ti4-legacy",
    "crates/ti4-cli",
    "crates/ti4-tensor",
    "crates/ti4-mlp",
    "crates/ti4-infer",
    "crates/ti4-review",
    "crates/ti4-host",
    "crates/ti4-server",
    "crates/ti4-rule-bot",
    "crates/ti4-replayer",
    "crates/ti4-wasm",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
# Internal
ti4-model = { path = "crates/ti4-model" }
ti4-content = { path = "crates/ti4-content" }
ti4-engine = { path = "crates/ti4-engine" }
ti4-policy = { path = "crates/ti4-policy" }
ti4-sim = { path = "crates/ti4-sim" }
ti4-calc = { path = "crates/ti4-calc" }
ti4-training = { path = "crates/ti4-training" }
ti4-bridge = { path = "crates/ti4-bridge" }
ti4-legacy = { path = "crates/ti4-legacy" }
ti4-cli = { path = "crates/ti4-cli" }
ti4-tensor = { path = "crates/ti4-tensor" }
ti4-mlp = { path = "crates/ti4-mlp" }
ti4-infer = { path = "crates/ti4-infer" }
ti4-review = { path = "crates/ti4-review", default-features = false }
ti4-host = { path = "crates/ti4-host" }
ti4-server = { path = "crates/ti4-server" }
ti4-rule-bot = { path = "crates/ti4-rule-bot" }
ti4-replayer = { path = "crates/ti4-replayer" }
xtask = { path = "crates/xtask" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_stacker = "0.1"
bincode = "2"
sha2 = "0.10"
unicode-normalization = "0.1"
blake2 = "0.10"
hex = "0.4"
flate2 = "1"
zstd = "0.13"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rand_chacha = "0.9"
parquet = "55"
# Pinned exactly: tch 0.22.0 is the release built against libtorch 2.9.x, which is what
# plans/artifacts/libtorch-2.9.1-cpu.manifest.json pins. Newer tch requires libtorch 2.13 (M09-025).
tch = "=0.22.0"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
anyhow = "1"
itertools = "0.14"
rayon = "1.11"
mimalloc = { version = "0.1", default-features = false }
smallvec = { version = "1", features = ["const_generics", "const_new"] }
hashbrown = "0.15"
indexmap = "2"
bitflags = { version = "2", features = ["std"] }
enumset = "1.1.5"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
proptest = "1.6"
# TypeScript types of the wire (`ts` features of ti4-model, ti4-engine, ti4-calc, ti4-host, ti4-wasm).
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
# Keep GTK/Wayland defaults off; XDG Portal is the Linux backend and builds on WSL without GTK.
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6", "xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
# Denied, not warned: a second `#[test]` on one function is always a test inserted between an
# existing attribute and the function it belonged to, which silently stops the *other* test
# running. It happened three times on this branch alone and the warning went unread each time.
duplicate_macro_attributes = "deny"

[workspace.lints.clippy]
# Keep Clippy focused on correctness and runtime performance; opt into type complexity explicitly.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
type_complexity = "warn"
# The `cargo` group checks publishability — description, license, keywords, categories. These
# crates are a private workspace and are not published, so it only ever produces noise.
cargo = { level = "allow", priority = -1 }

# Dropped `nursery`: across this project's history it produced no finding that was a defect,
# while costing a round-trip each time on code that was already correct and tested. Every real
# bug so far was caught by a test, not a lint.
#
# These three fire on shapes the rules genuinely have. A combat step needs the state, the corpus
# it is read against, both halves of the pinned random source, and both sides; bundling them to
# satisfy a counter would hide which of them the step mutates.
too_many_arguments = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# A data model with hundreds of accessors does not benefit from `#[must_use]` on each; the
# attribute stops meaning anything once it is everywhere.
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The browser build: size first. `cargo build -p ti4-wasm --target wasm32-unknown-unknown
# --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"

# The browser build for development: `web-shared/scripts/build-wasm.mjs <out.wasm> --dev`
# (`web2/scripts/build-wasm.sh --dev`). Not optimized and
# incremental, so a change of the engine is rebuilt in seconds; the file is about three times the
# size of the release build and the engine is slower in the page. `panic = "abort"` as in the
# release build, so a panic looks the same in both.
[profile.wasm-dev]
inherits = "dev"
opt-level = 0
debug = false
# Without the names of the functions the file is much smaller, and it loads faster.
strip = true
panic = "abort"
incremental = true

[profile.dev]
# Line numbers in backtraces, nothing else. Full debuginfo was copied into every test executable's
# .dwp: 6 GB of a 17 GB target directory. For a debugger session use `--profile debugger`.
debug = "line-tables-only"
split-debuginfo = "packed"

# Third-party dependencies are compiled with optimization even in the dev and test profiles, while
# every workspace crate stays a plain debug build (opt-level 0, debug assertions and overflow checks
# ON; `"*"` matches only non-workspace-member packages). The server's hot paths run through
# serde_json, sha2/blake2, zstd/flate2, rand, hashbrown and tokio/axum; optimizing them roughly
# halves save_history/load_history and the per-decision commit wait without touching the debug
# checks of our own code. `debug = false` drops dependency debug info (smaller target dir and
# faster links); backtraces keep file:line for our code. Profile settings do not change Cargo.lock.
# build scripts and proc-macros are covered by `build-override` (opt-level 0 by default), so the
# extra compile time is only the final dependency code.
[profile.dev.package."*"]
opt-level = 3
debug = false

# The kernels of the MLP bots are optimized in every debug build too (the server, the tests, the
# wasm dev build): unoptimized, a decision takes milliseconds in place of tens of microseconds.
# Their results do not depend on it; the tests of `ti4-infer` compare against plain references.
[profile.dev.package.ti4-infer]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.wasm-dev.package.ti4-infer]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.debugger]
inherits = "dev"
debug = "full"
